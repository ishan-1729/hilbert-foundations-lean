name = "hilbert-foundations"
version = "0.1.0"
keywords = ["math", "geometry", "foundations-of-geometry", "hilbert", "history-of-mathematics"]
defaultTargets = ["HilbertFoundations"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
# mathlib release tag v4.36.0 (commit fc4f59e577feb1a4956671bc04ac18aaaf8cd842), matching lean-toolchain
rev = "v4.36.0"

# Tau Ceti, pinned to its last commit on Lean v4.36.0 and the mathlib commit above. Only the modules
# imported by HilbertFoundations/Theorem42Close.lean (the Hasse–Minkowski theorem) and by the library
# Hilbert17 below are built.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "aa3cfad1274c06cff25f2b58848498b3c3f68d0f"

[[lean_lib]]
name = "HilbertFoundations"

# Vendored proof of the Jordan curve theorem (see JordanPick/README.md); options as in its upstream lakefile.
# The library has no root module `JordanPick.lean`; its modules are the files of the directory `JordanPick/`.
[[lean_lib]]
name = "JordanPick"
globs = ["JordanPick.+"]
leanOptions = { relaxedAutoImplicit = false, maxSynthPendingDepth = 3 }

# Vendored proof of Artin's theorem on definite polynomials, the solution of Hilbert's seventeenth problem
# (see Hilbert17/README.md). The library has no root module `Hilbert17.lean`; its modules are the files of
# the directory `Hilbert17/`. The upstream package sets no Lean options, so `autoImplicit` has Lean's
# default value there; it is set to that value here. Only HilbertFoundations/TwoVariablesClose.lean
# imports the library.
[[lean_lib]]
name = "Hilbert17"
globs = ["Hilbert17.+"]
leanOptions = { autoImplicit = true }
